name: Terraform Validate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  push:
    branches: ["new_branch"]

permissions:
  contents: read

jobs:
  terraform_validate:
    name: "Validate Terraform Configuration"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Check Terraform files
      run: |
        if ! grep -q 'backend "azurerm"' *.tf; then
          echo "Error: Azure backend configuration not found"
          exit 1
        fi
        if ! grep -q 'resource_group_name' *.tf || ! grep -q 'storage_account_name' *.tf || ! grep -q 'container_name' *.tf || ! grep -q 'key' *.tf; then
          echo "Error: Missing required backend configuration elements"
          exit 1
        fi
        echo "Terraform files check passed"

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init -backend=false

    - name: Terraform Validate
      run: terraform validate


  terraform_remote_state:
    name: Verify Azure remote state
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency: terraform-remote-state
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4
          terraform_wrapper: false

      - name: Initialize Azure backend with OIDC
        run: terraform init -input=false -lockfile=readonly

      - name: Apply and verify state
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
          terraform state list | grep -Fx 'terraform_data.example'
